apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-webcolor
  namespace: argocd
  labels:
    curso: gitops
spec:
  project: default
  source:
    repoURL: https://github.com/MarceloPaglione2411/web-page-deploy.git 
    path: k8s
    targetRevision: HEAD
    directory:
      recurse: true
    #  exclude: 'webcolor/nginx/*'
  destination:
    server: https://kubernetes.default.svc
    namespace: webcolor
  info:
    - name: Projeto
      value: "Curso de GitOps"
    
    

